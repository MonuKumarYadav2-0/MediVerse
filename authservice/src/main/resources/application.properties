# =========================================================
# APPLICATION
# =========================================================

spring.application.name=auth-service
server.port=8081
spring.config.import=configserver:http://localhost:8888


# =========================================================
# MYSQL DATABASE
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/mediverse_auth
spring.datasource.username=root
spring.datasource.password=Monu@123

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# =========================================================
# JWT
# =========================================================

jwt.secret=MediverseSecretKeyForDevelopmentOnly123456789
jwt.expiration=900000000
jwt.refresh-expiration=900000000


# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework.security=INFO
logging.level.com.mediverse=DEBUG

# eureka client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true